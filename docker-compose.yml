    environment:
      - PORT=5000
      - JWT_SECRET=mysecret
      - MONGO_URI=mongodb+srv://suniljadhav152005_db_user:Sunil152005@leaddashboard.fb4yd8d.mongodb.net/?appName=LeadDashboard
